<!doctype html>
<html lang="vi"><meta charset="utf-8"><title>R1b body and rifle composition</title>
<style>html,body{margin:0;background:#24323a;color:#eee;font:14px system-ui}canvas{display:block;image-rendering:pixelated}label,button{font:inherit;margin:8px}#controls{padding:8px}#readout{white-space:pre-wrap;margin:12px}</style><aside style="position:relative;z-index:999;background:#182124;color:#e9e2d5;padding:14px 20px;font:14px system-ui;border-bottom:1px solid #465751"><a style="color:#c7d9c8" href="../../../index.html">Black Veil / Development archive</a><span style="display:block;margin-top:5px">Historical review board. Recorded checks apply to their original snapshot. Images may be web-sized previews; this is a documentation archive, not a playable web build.</span></aside>
<div id="controls"><label>Action <select id="action"><option>reload</option><option>melee</option></select></label><label>Skin <select id="skin"><option>default</option><option>olive</option></select></label><label><input type="checkbox" id="overlay">Grip/axis/order</label><label>Scale <select id="scale"><option>1</option><option selected>4</option></select></label><label><input type="checkbox" id="play">Playback</label><button id="download">Export PNG</button></div>
<canvas id="strip"></canvas><pre id="readout"></pre>
<script src="review_data.js"></script><script>
const q=new URLSearchParams(location.search), dirs=['n','e','s','w'], aim={n:270,e:0,s:90,w:180}, cw=80,ch=80;
const atlas=new Image(),defaultGun=new Image(),oliveGun=new Image();
atlas.src='../../../media/dd142c1880a086d38d6caadcdadda8d0f7166b3a45dd4a48f60a8e36e8de01e0.png';defaultGun.src='../../../media/2844e377b1c7c32c3f7de8135241d7124278501b49ebbd88f03c825acf431b0d.png';oliveGun.src='../../../media/f031faa4364d890d5a9ac18a341e1da6a5abe22588c0eb3f025884959f1e9071.png';
const canvas=document.querySelector('#strip'),ctx=canvas.getContext('2d'), ui=id=>document.getElementById(id);
ui('action').value=q.get('action')||'reload';ui('skin').value=q.get('skin')||'default';ui('scale').value=q.get('scale')||'4';ui('overlay').checked=q.get('overlay')==='1';
if(q.get('capture')==='1'){ui('controls').hidden=true;ui('readout').hidden=true;}
function transform(row,wp){const a=(aim[row.direction]+row.angle_offset_degrees)*Math.PI/180,x=wp[0]-14,y=wp[1]-9;return [row.grip_px[0]+x*Math.cos(a)-y*Math.sin(a),row.grip_px[1]+x*Math.sin(a)+y*Math.cos(a)];}
function actor(row,x,y,overlay){
 ctx.save();ctx.translate(x+16,y+8);
 function rifle(){ctx.save();ctx.translate(...row.grip_px);ctx.rotate((aim[row.direction]+row.angle_offset_degrees)*Math.PI/180);ctx.drawImage(ui('skin').value==='olive'?oliveGun:defaultGun,-14,-9);ctx.restore();}
 for(const slot of row.part_order){const part=row.parts[slot],r=part.rect_px,o=part.offset_px;ctx.drawImage(atlas,...r,o[0],o[1],48,64);if(slot===row.after_part)rifle();}
 if(overlay){ctx.lineWidth=.5;ctx.strokeStyle='#52efb0';ctx.strokeRect(0,0,48,64);ctx.fillStyle='#ff4b7e';ctx.fillRect(row.grip_px[0]-1,row.grip_px[1]-1,2,2);const muzzle=transform(row,[35,5]);ctx.beginPath();ctx.moveTo(...row.grip_px);ctx.lineTo(...muzzle);ctx.strokeStyle='#ffdf5a';ctx.stroke();ctx.fillStyle='#62cfff';ctx.fillRect(row.left_hand_point_px[0]-1,row.left_hand_point_px[1]-1,2,2);if(row.action==='melee'&&row.pose===2){const hit=transform(row,row.weapon_contact_point_px);ctx.strokeStyle='#ff4b7e';ctx.strokeRect(hit[0]-2,hit[1]-2,4,4);}}
 ctx.restore();
}
let start=performance.now();
function draw(now=0){
 const scale=Number(ui('scale').value),action=ui('action').value,play=ui('play').checked,rows=REVIEW_DATA.sidecar.pose_rows.filter(r=>r.action===action);
 canvas.width=(play?cw:cw*6)*scale;canvas.height=ch*4*scale;ctx.scale(scale,scale);ctx.imageSmoothingEnabled=false;ctx.fillStyle='#24323a';ctx.fillRect(0,0,canvas.width/scale,canvas.height/scale);
 const pose=Math.floor((now-start)/100)%6;
 for(const row of rows){if(play&&row.pose!==pose)continue;const x=(play?0:row.pose)*cw,y=dirs.indexOf(row.direction)*ch;ctx.fillStyle='#e8ecdc';ctx.font='7px monospace';ctx.fillText(row.direction.toUpperCase()+' '+row.pose+' '+row.angle_offset_degrees+'°',x+4,y+7);actor(row,x,y,ui('overlay').checked);}
 ui('readout').textContent=rows.map(r=>r.direction+' '+r.pose+' : '+r.part_order.join(' > ')+'; rifle after '+r.after_part+'; L '+r.left_hand_role).join('\n');
 document.documentElement.dataset.ready='true';
}
Promise.all([atlas,defaultGun,oliveGun].map(i=>new Promise((ok,fail)=>{i.onload=ok;i.onerror=fail;if(i.complete&&i.naturalWidth)ok();}))).then(()=>{draw();function tick(t){if(ui('play').checked)draw(t);requestAnimationFrame(tick);}requestAnimationFrame(tick);});
for(const id of ['action','skin','overlay','scale','play'])ui(id).onchange=()=>{start=performance.now();draw();};
ui('download').onclick=()=>{const a=document.createElement('a');a.href=canvas.toDataURL();a.download=ui('action').value+'_'+ui('skin').value+'_'+ui('scale').value+'x.png';a.click();};
</script></html>
